services:
  - type: web
    name: boat-predict-ai
    runtime: python
    region: singapore
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/warmup
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOAT_STARTUP_WARMUP
        value: "1"
      - key: BOAT_AUTO_BACKFILL
        value: "1"
      - key: BOAT_RESULT_WARMER
        value: "1"
      - key: BOAT_BACKGROUND_SYNC_INTERVAL
        value: "900"
      - key: BOAT_FETCH_TIMEOUT
        value: "8"
      - key: BOAT_DETAIL_FETCH_TIMEOUT
        value: "3"
      - key: BOAT_PAST_RESULT_CACHE_SECONDS
        value: "2592000"
      - key: BOAT_ADMIN_BACKFILL_WORKERS
        value: "4"
      - key: BOAT_ADMIN_RESULT_TIMEOUT
        value: "16"
      - key: BOAT_ADMIN_SIGNAL_TIMEOUT
        value: "2"
      - key: BOAT_DATA_DIR
        value: /var/data/boat-predict
    disk:
      name: boat-predict-data
      mountPath: /var/data
      sizeGB: 5
